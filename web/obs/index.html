<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>M-Alert — incrustation OBS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Source navigateur OBS : 1920 × 1080, fond transparent. */
    html, body { margin: 0; background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
    #tsunami { position: fixed; inset: 0; width: 100vw; height: 100vh; display: none; }
    #banner { position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%); width: var(--bw, 66vw); height: auto; display: none; box-shadow: 0 0 24px rgba(0,0,0,.5); }
    body.top #banner { top: 3vh; bottom: auto; }
    /* Carte des tsunamis : bandeau (alerte sismique précoce) réduit en haut à gauche. */
    body.show-tsunami #banner { left: 1.5vw; top: 2vh; bottom: auto; transform: none; width: 30vw; }
    body.show-tsunami #tsunami, body.show-banner #banner { display: block; }
    #info { position: fixed; left: 50%; bottom: 3vh; transform: translateX(-50%); width: var(--iw, 36vw); height: auto; display: none; box-shadow: 0 0 24px rgba(0,0,0,.5); }
    body.show-info #info { display: block; }
    body.show-info.show-banner #info { bottom: auto; top: 3vh; }
    /* Annulation : le cadre prend la place du bandeau, en bas (le bandeau est masqué). */
    body.cancelling #banner { display: none !important; }
    body.cancelling.show-info #info { top: auto; bottom: 8vh; }
    /* Fond de l'écran réduit (source « M-Alert (fond) », layer=fond) : bleu et texte en haut. */
    #fond { position: fixed; inset: 0; display: none; background: linear-gradient(160deg, #0b3fae 0%, #1257d6 45%, #0a3a9e 100%); }
    body.layer-fond #fond { display: block; }
    /* Texte en haut seul (source « M-Alert (texte) », layer=texte) : bande bleue sur l'image. */
    body.layer-texte #fond { display: block; bottom: auto; height: 17vh; opacity: .94; box-shadow: 0 .4vh 1.6vh rgba(0,0,0,.45); }
    #fondText { position: absolute; left: 10vw; right: 6vw; top: 2.2vh; font: 700 4.6vh/1.18 "Noto Sans", "Segoe UI", Arial, sans-serif; color: #fff;
      text-shadow: 0 0 .25vh #000, .15vh .15vh 0 #000, -.15vh -.15vh 0 #000, .15vh -.15vh 0 #000, -.15vh .15vh 0 #000; }
    #fondText div { white-space: nowrap; overflow: hidden; }
    #fondText.intro { font-size: 6vh; }
    /* Séisme : bandeau rouge « Alerte de tremblement de terre » en haut pendant 3 secondes. */
    #quakeTop { position: fixed; left: 50%; top: 3vh; transform: translateX(-50%); display: none; padding: .6vh 2.2vw .9vh;
      background: #ff0000; color: #fff; font: 500 5.4vh/1.15 "Noto Sans", "Segoe UI", Arial, sans-serif; white-space: nowrap; box-shadow: 0 0 1.6vh rgba(0,0,0,.45); }
    body.show-quake-top #quakeTop { display: block; }
    /* Tsunami / vagues-submersion après la carte plein écran : mini-carte et tableau des mesures. */
    #miniMap { position: fixed; right: 1vw; bottom: 1.5vh; width: 30vw; height: auto; display: none; opacity: .93; border: .2vh solid rgba(255,255,255,.35); }
    #coastTable { position: fixed; left: 1.5vw; bottom: 4vh; width: 46vw; display: none; font: 600 3.3vh/1.2 "Noto Sans", "Segoe UI", Arial, sans-serif; color: #fff; }
    body.show-mini #miniMap, body.show-table #coastTable { display: block; }
    /* Écran réduit : dans l'image réduite (à droite du panneau de gauche). */
    body.reduced #miniMap { right: 10.6vw; }
    body.reduced #coastTable { left: 11vw; }
    #coastTable .ct-title { background: #000; text-align: center; padding: .5vh 0; font-weight: 700; margin-bottom: .6vh; letter-spacing: .1em; }
    #coastTable .ct-level { display: inline-block; padding: .3vh 2vw; font-weight: 700; margin-bottom: .4vh; }
    #coastTable .ct-row { display: grid; grid-template-columns: 1fr 15.5vw 7.5vw; gap: .5vw; margin-bottom: .45vh; background: rgba(10,10,10,.82); align-items: stretch; }
    #coastTable .ct-name { padding: .35vh 1vw; text-align: center; white-space: nowrap; overflow: hidden; }
    #coastTable .ct-when { margin: .35vh 0; border: .15vh solid #aaa; text-align: center; font-size: 2.5vh; white-space: nowrap; display: flex; align-items: center; justify-content: center; }
    #coastTable .ct-val { text-align: center; font-weight: 700; font-size: 3.6vh; display: flex; align-items: center; justify-content: center; }
    #coastTable .ct-page { position: absolute; right: 0; bottom: -3.2vh; font-size: 2vh; opacity: .85; }
    /* Panneau « Alerte sismique précoce » à gauche (comme la NHK), colonnes verticales. */
    #eew { position: fixed; left: 1vw; top: 19vh; width: 8.6vw; height: 76vh; box-sizing: border-box; display: none; flex-direction: column; background: #2f6fd6;
      border: .35vh solid #fff; padding: .8vh .3vw; font: 700 2.3vh/1.18 "Noto Sans", "Segoe UI", Arial, sans-serif; color: #fff;
      text-align: center; box-shadow: 0 0 1.4vh rgba(0,0,0,.45); }
    body.show-eew #eew { display: flex; }
    #eew .eew-red { background: #e8213f; padding: .6vh .2vw; margin-bottom: .9vh; }
    #eew .eew-yellow { color: #ffe600; margin-bottom: 1.4vh; }
    #eew .eew-list { flex: 1; overflow: hidden; position: relative; }
    #eew .eew-dep { display: block; margin-bottom: 1.3vh; }
    #eew .eew-page { font-size: 1.8vh; opacity: .85; min-height: 2vh; }
    /* Panneau de gauche affiché : le tableau des mesures passe à sa droite. */
    body.show-eew #coastTable { left: 11vw; }
    /* Alerte missile (comme la NHK, J-Alert) : écran plein « Informations de protection civile », puis
       bloc en bas sur l'image (message, zones, carte), encart « Alerte » et consigne en haut à droite. */
    #missileCard { position: fixed; inset: 0; background: #000; display: none; color: #fff; font-family: "Noto Sans", "Segoe UI", Arial, sans-serif; }
    body.show-missile-card #missileCard { display: block; }
    #missileCard .mc-head { position: absolute; left: 9vw; right: 9vw; top: 1.5vh; height: 10.5vh; display: flex; align-items: center;
      background: linear-gradient(#4a4a4a, #0c0c0c 70%); }
    #missileCard .mc-title { flex: 1; text-align: center; font: 700 5.6vh/1 "Noto Sans", "Segoe UI", Arial, sans-serif; letter-spacing: .02em; }
    #missileCard .mc-bar { position: absolute; left: 9vw; right: 9vw; top: 12vh; height: 12.5vh; background: #d10f0f; }
    #missileCard .mc-body { position: absolute; left: 10.5vw; right: 10.5vw; top: 26vh; font-size: 4.1vh; line-height: 1.45; }
    #missileCard .mc-zones-label { margin-top: 5vh; }
    #missileCard .mc-time { position: absolute; right: 11vw; bottom: 9.5vh; font-size: 3.4vh; }
    #missileCard .mc-foot { position: absolute; left: 9vw; right: 9vw; bottom: 0; height: 6.5vh; background: linear-gradient(#9a9a9a, #6f6f6f); }
    #missileLower { position: fixed; left: 4.6vw; right: 4vw; bottom: 3.5vh; height: 46vh; display: none; gap: 1.2vw;
      font-family: "Noto Sans", "Segoe UI", Arial, sans-serif; color: #fff; }
    body.show-missile #missileLower { display: flex; }
    #missileLower .ml-main { flex: 0 0 64%; display: flex; flex-direction: column; }
    #missileLower .ml-side { flex: 1; display: flex; flex-direction: column; }
    #missileLower .ml-head { background: #e01414; color: #fff; text-align: center; font: 800 3.8vh/1.35 "Noto Sans", "Segoe UI", Arial, sans-serif; letter-spacing: .12em; white-space: nowrap; overflow: hidden; }
    #missileLower .ml-msg { background: rgba(0,0,0,.55); padding: .8vh 1.2vw; font-size: 3.4vh; line-height: 1.32; margin-bottom: 2.4vh; }
    #missileLower .ml-zhead { background: #f5e60a; color: #111; text-align: center; font: 800 3.4vh/1.35 "Noto Sans", "Segoe UI", Arial, sans-serif; letter-spacing: .12em; white-space: nowrap; }
    #missileLower .ml-zones { flex: 1; background: rgba(0,0,0,.55); padding: .8vh 1.2vw; font-size: 3.2vh; line-height: 1.35; overflow: hidden; }
    #missileLower .ml-map { flex: 1; background: rgba(0,0,0,.45); position: relative; }
    #missileLower .ml-map canvas { position: absolute; inset: 1vh; width: calc(100% - 2vh); height: calc(100% - 2vh); object-fit: contain; }
    #missileFlash { position: fixed; right: 3.5vw; top: 4.5vh; display: none; align-items: stretch; box-shadow: 0 0 1vh rgba(0,0,0,.4);
      font-family: "Noto Sans", "Segoe UI", Arial, sans-serif; }
    body.show-missile #missileFlash { display: flex; }
    #missileFlash .mf-tag { background: #e01414; color: #fff; font: 800 3.4vh/1.2 "Noto Sans", "Segoe UI", Arial, sans-serif; padding: .6vh .7vw; display: flex; align-items: center; }
    #missileFlash .mf-text { background: #fff; color: #111; font: 700 3.3vh/1.3 "Noto Sans", "Segoe UI", Arial, sans-serif; padding: .6vh 1vw; max-width: 30vw; border-right: .5vh solid #1b3bb5; }
    #missileAdvice { position: fixed; right: 3.5vw; top: 22vh; display: none; border: .5vh solid #9b2fb5; background: #fff; box-shadow: 0 0 1vh rgba(0,0,0,.4);
      font-family: "Noto Sans", "Segoe UI", Arial, sans-serif; }
    body.show-missile #missileAdvice { display: flex; }
    #missileAdvice .ma-tag { background: #b3123a; color: #fff; font: 800 3.4vh/1.2 "Noto Sans", "Segoe UI", Arial, sans-serif; padding: .5vh .7vw; display: flex; align-items: center; }
    #missileAdvice .ma-text { color: #111; font: 800 3.4vh/1.25 "Noto Sans", "Segoe UI", Arial, sans-serif; padding: .5vh 1.2vw; text-align: center; }
    #status { position: fixed; right: 8px; top: 6px; font: 600 14px sans-serif; color: #fff; text-shadow: 0 0 3px #000; opacity: .0; }
    body.debug #status { opacity: .85; }
  </style>
</head>
<body>
  <div id="fond"><div id="fondText"></div></div>
  <div id="quakeTop">Alerte de tremblement de terre</div>
  <canvas id="tsunami"></canvas>
  <canvas id="miniMap"></canvas>
  <div id="coastTable"></div>
  <div id="eew"></div>
  <canvas id="banner"></canvas>
  <canvas id="info"></canvas>
  <div id="missileCard">
    <div class="mc-head"><span class="mc-title">Informations de protection civile</span></div>
    <div class="mc-bar"></div>
    <div class="mc-body"><div class="mc-msg"></div><div class="mc-zones-label">Zones concernées :</div><div class="mc-zones"></div></div>
    <div class="mc-time"></div>
    <div class="mc-foot"></div>
  </div>
  <div id="missileLower">
    <div class="ml-main"><div class="ml-head">M-Alert　Informations de protection civile</div><div class="ml-msg"></div><div class="ml-zhead">Zones M-Alert concernées</div><div class="ml-zones"></div></div>
    <div class="ml-side"><div class="ml-zhead">Zones concernées</div><div class="ml-map"><canvas id="missileMap"></canvas></div></div>
  </div>
  <div id="missileFlash"><span class="mf-tag">Alerte</span><span class="mf-text"></span></div>
  <div id="missileAdvice"><span class="ma-tag"></span><span class="ma-text"></span></div>
  <div id="status"></div>
  <script src="../config.js?v=3.0.1-5"></script>
  <script src="../data/departements.js?v=3.0.1-5"></script>
  <script src="../data/cotes.js?v=3.0.1-5"></script>
  <script src="../js/common.js?v=3.0.1-5"></script>
  <script src="../js/sound.js?v=3.0.1-5"></script>
  <script src="../js/banner.js?v=3.0.1-5"></script>
  <script src="obs.js?v=3.0.1-5"></script>
</body>
</html>
