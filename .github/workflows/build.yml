# Construit les applications de bureau Windows (installateur + portable) et Linux (AppImage + .deb),
# et les applications mobiles Android (.apk) et iOS (.ipa non signé, à installer avec AltStore ou Sideloadly).
# À chaque modification de l'application et manuellement (onglet Actions) : fichiers dans « Artifacts ».
# Pour publier une version : onglet Actions > « Applications de bureau » > Run workflow, en indiquant
# la version (ex. 1.0.0, identique à package.json), ou pousser un tag « v1.0.0 ».
# Le tag et la Release sont alors créés avec tous les fichiers.
name: Applications de bureau

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 1.0.0) ; laisser vide pour construire sans publier"
        required: false
        default: ""
      remplacer:
        description: "Remplacer la Release et le tag de cette version s'ils existent déjà"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: M-Alert-${{ matrix.os }}
          # latest*.yml et *.blockmap servent aux mises à jour automatiques (Windows, AppImage).
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  # Application Android (Capacitor) : APK signé (clé des secrets du dépôt si présente, sinon la clé
  # publique de M-Alert, mobile/android/app/m-alert-public.jks).
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      V: ${{ inputs.version != '' && inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '0.0.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node copy-web.js && npx cap sync android
      - name: APK
        run: |
          V="${V#v}"; [ "$V" = 0.0.0 ] && V="$(node -p "require('../package.json').version")"
          cd android && chmod +x gradlew && ./gradlew assembleRelease -PappVersion="$V" --no-daemon
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk "../out/M-Alert-$V.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: M-Alert-android
          path: mobile/out/*.apk
          if-no-files-found: error

  # Application iOS : .ipa non signé (pas de compte développeur Apple), à signer à l'installation.
  ios:
    runs-on: macos-26
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    env:
      V: ${{ inputs.version != '' && inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '0.0.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node copy-web.js && npx cap sync ios
      - name: IPA non signé
        run: |
          V="${V#v}"; [ "$V" = 0.0.0 ] && V="$(node -p "require('../package.json').version")"
          X="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"; [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          IFS=. read -r a b c <<< "$V"
          cd ios/App && xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$((a*10000+b*100+${c%%[^0-9]*}))" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload ../../out && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "../../out/M-Alert-$V-non-signe.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: M-Alert-ios
          path: mobile/out/*.ipa
          if-no-files-found: error

  # Une seule Release par tag, une fois Windows et Linux construits.
  release:
    # iOS peut échouer sans bloquer la Release (l'.ipa est alors absent).
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.android.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.version != '') }}
    needs: [build, android, ios]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Vérifier que la version correspond à package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::La version $TAG ne correspond pas à package.json ($expected)."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Somme de contrôle des fichiers
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Remplacer la Release existante
        if: inputs.remplacer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$TAG" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || echo "Pas de Release $TAG à remplacer."
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: M-Alert ${{ env.TAG }}
          body_path: .github/release-notes.md
          files: dist/*
